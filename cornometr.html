<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کرنومتر حرفه‌ای</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        /* تنظیمات پایه و متغیرها */
        :root {
            /* پالت رنگ روشن (پیش‌فرض) */
            --bg-surface: #ffffff;
            --bg-surface-2: hsl(206 20% 96%);
            --bg-app: linear-gradient(135deg, var(--bg-surface-2) 19em, var(--bg-surface) 0);
            
            --text-main: hsl(193, 10%, 13%);
            --text-muted: hsl(200, 10%, 43%);
            
            --gray-0: hsl(196, 14%, 98%);
            --gray-1: hsl(195, 11%, 93%);
            --gray-2: hsl(198, 8%, 86%);
            --gray-3: hsl(196, 7%, 73%);
            
            --shadow-light: hsl(210 15% 100% / 0.8);
            --shadow-dark: hsl(210 20% 20% / 0.2);
            --deco-border: var(--gray-3);
            
            /* رنگ دکمه‌ها */
            --toggle-start: hsl(198 90% 46%);
            --toggle-pause: hsl(0 84% 62%);
            --add: hsl(148 69% 45%); /* کمی تیره‌تر برای خوانایی بهتر */
            --reset: hsl(210 12% 90%);
            --btn-text: #ffffff;
            --reset-text: var(--text-main);
            
            --deco-gradient: radial-gradient(
                70% 70% at 30% 20%,
                var(--gray-0) 10% 40%,
                var(--gray-1),
                var(--gray-2)
            );
        }

        /* حالت تاریک */
        [data-theme="dark"] {
            --bg-surface: #1e1e1e;
            --bg-surface-2: #121212;
            --bg-app: linear-gradient(135deg, #181818 19em, #1e1e1e 0);

            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;

            --gray-0: #2c2c2c;
            --gray-1: #252525;
            --gray-2: #333333;
            --gray-3: #444444;

            --shadow-light: rgba(255, 255, 255, 0.05);
            --shadow-dark: rgba(0, 0, 0, 0.6);
            --deco-border: #444;

            --reset: #333;
            --reset-text: #fff;
            
            --deco-gradient: radial-gradient(
                70% 70% at 30% 20%,
                #333 10% 40%,
                #222,
                #111
            );
        }

        *, *::after, *::before {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* حذف هایلایت آبی در موبایل */
        }

        body {
            min-height: 100vh;
            display: grid;
            place-content: start center;
            font-family: "Vazirmatn", sans-serif;
            background-color: var(--bg-surface-2);
            color: var(--text-main);
            padding: 1rem;
            transition: background-color 0.3s ease;
        }

        /* دکمه تغییر تم */
        .theme-switch-wrapper {
            position: absolute;
            top: 1rem;
            left: 1rem; /* در حالت راست‌چین، چپ قرار می‌گیرد */
            z-index: 100;
        }
        
        .theme-btn {
            background: none;
            border: 2px solid var(--gray-3);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 1.2rem;
            display: grid;
            place-content: center;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            background-color: var(--gray-2);
        }

        /* کانتینر اصلی برنامه */
        .app {
            margin-top: 3rem;
            width: 100%;
            max-width: 380px; /* بهینه‌سازی عرض برای موبایل */
            min-height: 600px;
            display: flex;
            flex-flow: column;
            background: var(--bg-app);
            border: 1px solid var(--gray-2);
            border-radius: 1.5em;
            position: relative;
            box-shadow: 
                0 20px 40px -10px var(--shadow-dark),
                0 0 0 1px var(--gray-2);
            transition: background 0.3s ease;
        }

        header {
            border-radius: 1.5em 1.5em 0 0;
            display: grid;
            height: 3.5rem;
            flex-shrink: 0;
            place-content: center;
            border-bottom: 1px solid var(--gray-3);
            background: var(--bg-surface);
            box-shadow: 0 3px 5px var(--shadow-dark);
            transition: background 0.3s ease;
        }

        h1 {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0;
            color: var(--text-main);
        }

        main {
            display: flex;
            flex-flow: column;
            gap: 1.5rem;
        }

        /* بخش نمایش زمان */
        .display-section {
            display: grid;
            justify-content: center;
            margin: 1rem;
            padding-block-start: 0.5rem;
        }

        .display-deco {
            display: grid;
            grid-auto-flow: column;
            place-content: center;
            border-radius: 50%;
            min-height: 14rem; /* کمی بزرگتر برای موبایل */
            aspect-ratio: 1;
            border: 1px solid var(--deco-border);
            background: var(--deco-gradient);
            box-shadow: 
                -5px -5px 15px var(--shadow-light),
                5px 5px 15px var(--shadow-dark);
            position: relative;
        }

        /* عقربه‌های تزئینی */
        .display-deco::after,
        .display-deco::before {
            content: "";
            position: absolute;
            border-radius: inherit;
            border: 0.25em solid;
            pointer-events: none;
        }
        .display-deco::after {
            inset: 0.5em;
            border-color: transparent var(--gray-3) var(--gray-3) transparent;
            opacity: 0.3;
        }
        .display-deco::before {
            inset: -0.5em;
            border-color: var(--gray-2) transparent transparent var(--gray-2);
            opacity: 0.3;
        }

        .time-wrapper {
            direction: ltr; /* اعداد زمان باید چپ‌چین باشند */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .time-group {
            display: grid;
            text-align: center;
            width: 3.5rem;
        }

        .time {
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        .divider {
            font-size: 1.875rem;
            font-weight: 600;
            margin-inline: 0.1rem;
            color: var(--text-muted);
            padding-bottom: 0.5rem;
        }

        .label {
            margin-top: 0.25rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* دکمه‌های کنترل */
        .controls {
            padding: 0.5rem 1.5rem;
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        [type="button"] {
            cursor: pointer;
            display: grid;
            place-content: center;
            width: 100%;
            height: 3rem; /* ارتفاع مناسب برای لمس */
            font-family: "Vazirmatn", sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 100vh;
            border: none;
            position: relative;
            outline: none;
            transition: transform 0.1s;
        }

        [type="button"]:active {
            transform: scale(0.96);
        }

        /* استایل سه‌بعدی دکمه‌ها */
        [type="button"]:not(:disabled) {
            color: var(--btn-text);
            background: var(--bg-color);
            box-shadow: 
                0 4px 6px var(--shadow-dark),
                inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .toggle-btn[aria-pressed="false"] { --bg-color: var(--toggle-start); }
        .toggle-btn[aria-pressed="true"] { --bg-color: var(--toggle-pause); }
        .lap-btn { --bg-color: var(--add); }
        .reset-btn { 
            --bg-color: var(--reset); 
            color: var(--reset-text) !important;
        }

        [type="button"]:disabled {
            pointer-events: none;
            opacity: 0.5;
            background: var(--gray-2);
            color: var(--text-muted);
        }

        /* لیست دورها */
        .laps-section {
            display: grid;
            overflow-y: auto;
            padding: 0.75rem 0.5rem;
            margin-block: 0.5rem;
            flex-grow: 1; /* پر کردن فضای خالی پایین */
            max-height: 200px; /* اسکرول در صورت زیاد شدن */
        }

        .laps-title {
            width: max-content;
            margin-inline-start: 1rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: opacity 230ms ease;
        }

        .laps-title.is-muted { opacity: 0; }

        .laps {
            list-style: none;
            display: grid;
            gap: 0.5rem;
            margin-inline: 0.5em;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-2);
            border-radius: 0.5em;
            font-size: 0.9rem;
            font-weight: 500;
            background: var(--bg-surface);
            color: var(--text-main);
        }

        .lap-time {
            color: var(--text-main);
            font-family: monospace; /* برای نمایش بهتر اعداد */
            font-weight: 700;
            font-size: 1rem;
        }
        
        .lap-label {
             color: var(--text-muted);
        }

        /* انیمیشن اضافه شدن */
        .is-new {
            animation: lapAnim 300ms cubic-bezier(0.14, 0.56, 0.15, 1.18) both;
        }

        @keyframes lapAnim {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        /* اسکرول بار زیبا */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-3);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="theme-switch-wrapper">
        <button class="theme-btn" id="theme-toggle" aria-label="تغییر تم">
            🌙
        </button>
    </div>

    <div class="app">
        <header>
            <h1>کرنومتر</h1>
        </header>
        <main>
            <section class="display-section" id="display" aria-live="polite">
                <div class="display-deco">
                    <div class="time-wrapper">
                        <div class="time-group">
                            <span class="time minutes">00</span>
                            <span class="label">دقیقه</span>
                        </div>
                        <span class="divider">:</span>
                        <div class="time-group">
                            <span class="time seconds">00</span>
                            <span class="label">ثانیه</span>
                        </div>
                        <span class="divider">.</span>
                        <div class="time-group">
                            <span class="time milliseconds">00</span>
                            <span class="label">صدم</span>
                        </div>
                    </div>
                </div>
            </section>
            <nav class="controls">
                <button class="lap-btn" id="lap-btn" type="button" disabled>
                    ثبت دور
                </button>
                <button class="toggle-btn" type="button" aria-pressed="false">
                    شروع
                </button>
                <button class="reset-btn" type="button" disabled>
                    بازنشانی
                </button>
            </nav>
        </main>
        <section class="laps-section">
            <h2 class="laps-title" id="laps-title">زمان‌های ثبت شده</h2>
            <ol class="laps"></ol>
        </section>
    </div>

<script>
    const stopwatch = () => {
        const toggleBtn = document.querySelector(".toggle-btn");
        const resetBtn = document.querySelector(".reset-btn");
        const lapBtn = document.querySelector(".lap-btn");
        const lapsTitle = document.querySelector(".laps-title");
        const themeToggle = document.querySelector("#theme-toggle");

        // انتخابگرهای زمان
        const [minutes, seconds, milliseconds] = [
            ".minutes",
            ".seconds",
            ".milliseconds"
        ].map((sel) => document.querySelector(sel));

        const lapsList = document.querySelector(".laps");

        let rafId = null;
        let startTime = 0;
        let isRunning = false;

        const data = {
            elapsedTime: 0,
            laps: []
        };

        // مدیریت تم (شب/روز)
        const toggleTheme = () => {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            
            if (isDark) {
                body.removeAttribute('data-theme');
                themeToggle.textContent = '🌙';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
            }
        };

        const formatElapsedTime = (ms) => {
            const pad = (n) => String(n).padStart(2, "0");
            const total = Math.floor(ms);

            return {
                minutes: pad(Math.floor(total / 60000)),
                seconds: pad(Math.floor((total % 60000) / 1000)),
                milliseconds: pad(Math.floor((total % 1000) / 10))
            };
        };

        const updateTimeDisplay = () => {
            const t = formatElapsedTime(data.elapsedTime);
            minutes.textContent = t.minutes;
            seconds.textContent = t.seconds;
            milliseconds.textContent = t.milliseconds;
        };

        const updateElapsedTime = () => {
            if (!isRunning) return;
            data.elapsedTime = performance.now() - startTime;
            updateTimeDisplay();
            rafId = requestAnimationFrame(updateElapsedTime);
        };

        const updateLaptime = () => {
            const hasLaps = data.laps.length > 0;

            lapsTitle.classList.toggle("is-muted", !hasLaps);

            if (!hasLaps) {
                lapsList.replaceChildren();
                return;
            }

            const time = data.laps.at(-1);
            const t = formatElapsedTime(time); // t variable for lap time

            const li = document.createElement("li");
            li.className = "lap-item is-new";
            
            // نمایش فارسی و راست‌چین برای آیتم‌ها
            li.innerHTML = `
                <span class="lap-label">دور ${data.laps.length}</span>
                <span class="lap-time" dir="ltr">${t.minutes}:${t.seconds}.${t.milliseconds}</span>
            `;

            // اضافه کردن به ابتدای لیست برای دسترسی سریع‌تر
            lapsList.prepend(li);
        };

        const updateButtonStates = () => {
            toggleBtn.textContent = isRunning ? "مکث" : "شروع";
            toggleBtn.setAttribute("aria-pressed", String(isRunning));

            lapBtn.disabled = !isRunning;
            resetBtn.disabled = isRunning || data.elapsedTime === 0;
        };

        const toggleStopwatch = () => {
            isRunning = !isRunning;

            if (isRunning) {
                startTime = performance.now() - data.elapsedTime;
                rafId = requestAnimationFrame(updateElapsedTime);
            } else {
                cancelAnimationFrame(rafId);
            }

            updateButtonStates();
        };

        const addNewLap = () => {
            if (!isRunning) return;
            data.laps.push(data.elapsedTime); // ذخیره زمان فعلی به عنوان زمان دور
            updateLaptime();
        };

        const reset = () => {
            if (isRunning) return;

            data.elapsedTime = 0;
            data.laps = [];
            updateTimeDisplay();
            updateLaptime();
            updateButtonStates();
        };

        toggleBtn.addEventListener("click", toggleStopwatch);
        lapBtn.addEventListener("click", addNewLap);
        resetBtn.addEventListener("click", reset);
        themeToggle.addEventListener("click", toggleTheme);

        updateTimeDisplay();
        updateLaptime();
        updateButtonStates();
    };

    // اجرای اسکریپت پس از لود کامل صفحه
    document.addEventListener('DOMContentLoaded', stopwatch);
</script>

</body>
</html>
