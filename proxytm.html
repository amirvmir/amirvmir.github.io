<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amirvm proxy || دریافت آنلاین</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a0a;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .proxy-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        
        .proxy-card:hover {
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .btn-copy {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .btn-copy:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .btn-copy:active {
            transform: scale(0.95);
        }
        
        .status-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* لودینگ */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen text-white">

    <header class="border-b border-gray-800 bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-gray-700 to-gray-900 rounded-lg flex items-center justify-center border border-gray-600">
                    <i class="fas fa-shield-alt text-gray-300"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-white">amirvm proxy</h1>
                    <p class="text-xs text-gray-500">پروکسی یاب خودکار</p>
                </div>
            </div>
            <div class="flex items-center gap-2 text-sm text-gray-400">
                <button onclick="fetchProxies()" class="bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded transition text-xs border border-gray-700">
                    <i class="fas fa-sync-alt mr-1"></i> بروزرسانی
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <div class="text-center mb-12">
            <h2 class="text-3xl font-bold mb-3 text-white">پروکسی‌های زنده MTProto</h2>
            <p class="text-gray-400 max-w-2xl mx-auto leading-relaxed">
                این لیست به‌صورت خودکار از کانال ProxyMTProto دریافت می‌شود.
            </p>
        </div>

        <div id="proxy-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            </div>
        
        <div id="loading" class="loader"></div>
        <div id="error-msg" class="text-center text-red-400 hidden"></div>

    </main>

    <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white text-black px-6 py-3 rounded-lg shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 font-medium flex items-center gap-2">
        <i class="fas fa-check-circle text-green-600"></i>
        <span id="toast-message">کپی شد!</span>
    </div>

    <script>
        // کانفیگ دریافت اطلاعات
        const channelUrl = 'https://t.me/s/ProxyMTProto';
        const corsProxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(channelUrl);
        const container = document.getElementById('proxy-container');
        const loader = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');

        async function fetchProxies() {
            // ریست کردن وضعیت
            container.innerHTML = '';
            loader.style.display = 'block';
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(corsProxy);
                const data = await response.json();
                
                if (!data.contents) throw new Error('محتوایی دریافت نشد');

                // پارس کردن HTML تلگرام
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                const links = doc.querySelectorAll('a[href*="t.me/proxy"]');

                // فیلتر کردن لینک‌های تکراری و استخراج اطلاعات
                const uniqueProxies = new Set();
                const proxies = [];

                // پیمایش از آخر به اول (برای جدیدترین‌ها)
                for (let i = links.length - 1; i >= 0; i--) {
                    let href = links[i].href;
                    // تمیزکاری لینک (گاهی اوقات لینک‌های تلگرام دارای پارامترهای اضافی هستند)
                    if(href.includes('&amp;')) href = href.replace(/&amp;/g, '&');
                    
                    if (!uniqueProxies.has(href)) {
                        uniqueProxies.add(href);
                        
                        // استخراج پارامترها برای نمایش زیباتر
                        try {
                            const urlObj = new URL(href);
                            const params = new URLSearchParams(urlObj.search);
                            proxies.push({
                                url: href,
                                server: params.get('server'),
                                port: params.get('port'),
                                secret: params.get('secret')
                            });
                        } catch(e) { console.log('Bad URL', href); }
                    }
                    if (proxies.length >= 9) break; // نمایش حداکثر 9 پروکسی
                }

                renderProxies(proxies);

            } catch (err) {
                console.error(err);
                loader.style.display = 'none';
                errorMsg.innerText = 'خطا در دریافت پروکسی‌ها. لطفا فیلترشکن خود را بررسی کنید یا بعدا تلاش کنید.';
                errorMsg.classList.remove('hidden');
            }
        }

        function renderProxies(list) {
            loader.style.display = 'none';
            
            if(list.length === 0) {
                errorMsg.innerText = 'پروکسی جدیدی یافت نشد.';
                errorMsg.classList.remove('hidden');
                return;
            }

            list.forEach((proxy, index) => {
                // کوتاه کردن سکرت برای نمایش
                const shortSecret = proxy.secret ? proxy.secret.substring(0, 10) + '...' : 'Hidden';
                
                const card = document.createElement('div');
                card.className = 'proxy-card rounded-2xl p-6 relative overflow-hidden fade-in';
                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-32 h-32 bg-gray-800 rounded-full blur-3xl opacity-20 -mr-16 -mt-16"></div>
                    <div class="relative z-10">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-2">
                                <span class="w-3 h-3 bg-green-500 rounded-full status-dot"></span>
                                <span class="text-sm font-semibold text-gray-300">سرور ${index + 1}</span>
                            </div>
                            <span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-400">${proxy.port}</span>
                        </div>
                        
                        <div class="bg-black/30 rounded-lg p-3 mb-4 font-mono text-xs text-gray-400 break-all border border-gray-800 flex flex-col gap-1">
                            <div><span class="text-gray-600">IP:</span> ${proxy.server}</div>
                            <div><span class="text-gray-600">Secret:</span> ${shortSecret}</div>
                        </div>
                        
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard('${proxy.url}')" class="btn-copy flex-1 py-2.5 px-4 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                                <i class="fas fa-copy"></i>
                                <span>کپی</span>
                            </button>
                            <a href="${proxy.url}" class="btn-copy py-2.5 px-4 rounded-lg text-sm flex items-center justify-center" title="اتصال سریع">
                                <i class="fas fa-bolt"></i>
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // تابع کپی (بدون نیاز به ID المنت)
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('لینک پروکسی کپی شد!');
            }).catch(() => {
                // روش جایگزین برای مرورگرهای قدیمی
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                showToast('لینک پروکسی کپی شد!');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        }

        // اجرا هنگام لود صفحه
        fetchProxies();

    </script>
</body>
</html>
